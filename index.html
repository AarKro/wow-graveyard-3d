<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wow Graveyard</title>

    <link rel="stylesheet" href="./styles.css">
</head>
<body>
    <canvas class="webgl"></canvas>

    <div id="overlay">
      <div class="overlay__content">
        <h1 class="overlay__title">WoW Graveyard</h1>
        <p class="overlay__desc">Some of us made it. Most of us didn't. A graveyard for fallen WoW Hardcore characters, built with Three.js.</p>

        <div class="overlay__controls">
          <div class="control-group">
            <div class="keys">
              <div class="keys__row">
                <div class="key">W</div>
              </div>
              <div class="keys__row">
                <div class="key">A</div>
                <div class="key">S</div>
                <div class="key">D</div>
              </div>
            </div>
            <span class="control-label">Move</span>
          </div>

          <div class="control-group">
            <div class="key key--wide">Space</div>
            <span class="control-label">Jump</span>
          </div>

          <div class="control-group">
            <div class="key key--wide">&#x21E7; Shift</div>
            <span class="control-label">Sprint</span>
          </div>

          <div class="control-group">
            <svg class="mouse-svg" viewBox="0 0 40 58" xmlns="http://www.w3.org/2000/svg">
              <rect x="4" y="14" width="32" height="40" rx="16" fill="none" stroke="currentColor" stroke-width="2.5"/>
              <line x1="20" y1="14" x2="20" y2="32" stroke="currentColor" stroke-width="1.5"/>
              <line x1="5" y1="32" x2="35" y2="32" stroke="currentColor" stroke-width="1.5"/>
              <rect x="16" y="20" width="8" height="12" rx="4" fill="currentColor" opacity="0.75"/>
            </svg>
            <span class="control-label">Look</span>
          </div>
        </div>

        <p class="overlay__cta">Click anywhere to enter</p>
      </div>
    </div>

    <script type="module" src="./src/index.ts"></script>
</body>
</html>
